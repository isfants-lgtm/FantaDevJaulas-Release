# ZeedJaulas - configuracao
# Use & para cores nas mensagens e nomes.

# Quanto tempo o jogador fica preso (em segundos)
duracao-segundos: 15

# Cada uso gasta 1 item da jaula (sempre, para qualquer jogador).
# Para entregar varios: /jaula quadrada 10  ou  /jaula redonda <jogador> 10

# Como o item funciona:
#   SI_MESMO = botao direito em QUALQUER lugar cria a jaula ao seu redor e voce fica preso no meio dela
#   MIRAR    = prende o jogador que estiver na sua mira
modo-uso: SI_MESMO

# Alcance (em blocos) no modo MIRAR
alcance: 30

# Exige linha de visao (nao prende jogador atras de parede)
linha-de-visao: true

# Impede o jogador preso de se teleportar para fora (ender pearl, /spawn, etc.)
bloquear-teleporte: true

# Remove a jaula na hora se o jogador preso morrer
remover-ao-morrer: true

jaulas:
  quadrada:
    # Bloco usado nas paredes, chao e teto
    bloco: RED_STAINED_GLASS
    # Item que o jogador segura. Vazio = automatico (mesmo vidro, em painel)
    item: ""
    # Raio interno: 2 = espaco interno de 5x5 blocos
    raio: 2
    # Altura interna em blocos (minimo 2)
    altura: 3
    nome-item: "&c&lJaula Quadrada"
    lore:
      - "&7Clique com o botao direito em qualquer"
      - "&7lugar para criar a jaula ao seu redor."
      - "&7Gasta 1 item a cada uso."
  redonda:
    bloco: GLASS
    item: ""
    # Raio da esfera (minimo 2). 3 = bola de uns 7 blocos de largura
    # (a altura e calculada sozinha, o campo 'altura' nao e usado)
    raio: 3
    altura: 3
    nome-item: "&b&lJaula Redonda"
    lore:
      - "&7Clique com o botao direito em qualquer"
      - "&7lugar para criar a jaula ao seu redor."
      - "&7Gasta 1 item a cada uso."

particulas:
  ativado: true
  # Opcoes: END_ROD, CLOUD, FLAME, CRIT, PORTAL, HEART, NOTE, POOF
  ao-aparecer: END_ROD
  ao-desaparecer: CLOUD
  quantidade: 2

mensagens:
  prefixo: "&8[&bZeedJaulas&8] &r"
  sem-permissao: "&cApenas OPs podem usar este comando."
  uso: "&eUse: /jaula <quadrada|redonda> [jogador] [quantidade] | remover <jogador> | reload"
  recarregado: "&aConfiguracao recarregada!"
  jogador-nao-encontrado: "&cJogador nao encontrado."
  apenas-jogadores: "&cInforme um jogador: /jaula {jaula} <jogador>"
  item-recebido: "&aVoce recebeu uma jaula {jaula}!"
  item-entregue: "&aVoce entregou uma jaula {jaula} para {jogador}."
  nenhum-alvo: "&cNenhum jogador na sua mira."
  voce-se-prendeu: "&aVoce esta dentro da jaula por &e{segundos}s&a!"
  voce-ja-esta-preso: "&cVoce ja esta preso em uma jaula."
  jaula-aplicada: "&aVoce prendeu &e{jogador}&a por &e{segundos}s&a!"
  voce-foi-preso: "&cVoce foi preso em uma jaula por &e{segundos} segundos&c!"
  jaula-removida: "&aA jaula desapareceu. Voce esta livre!"
  alvo-ja-preso: "&c{jogador} ja esta preso em uma jaula."
  area-ocupada: "&cJa existe outra jaula nessa area."
  teleporte-bloqueado: "&cVoce nao pode se teleportar enquanto esta preso!"
  nao-preso: "&c{jogador} nao esta preso."
  jaula-removida-admin: "&aJaula de {jogador} removida."
